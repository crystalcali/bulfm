[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "bulfm"
version = "0.1.0"
description = "Local LFM3 browser-control GRPO training for DGX Spark"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pydantic>=2.10,<3", "PyYAML>=6,<7", "rich>=13,<15",
  "prompt-toolkit>=3.0.48,<4", "fastapi>=0.115,<1", "uvicorn>=0.30,<1",
  "psutil>=6,<8", "numpy>=2,<3"
]

[project.optional-dependencies]
train = [
  "torch>=2.14.1,<2.16", "transformers==5.20.2", "peft==0.21.2",
  "accelerate==1.15.0", "safetensors==0.8.0",
  "browsergym-miniwob==0.14.3", "socksio>=1,<2"
]
dev = ["pytest>=8,<10", "ruff>=0.12,<1", "httpx>=0.27,<1"]

[project.scripts]
bulfm = "bulfm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bulfm = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
