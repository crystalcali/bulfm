name: CPU checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[train,dev]'
      - run: python -c "import OpenSSL; import cryptography; from bulfm.diagnostics import training_imports; training_imports()"
      - run: python -m pytest -q
      - run: ruff check .
      - uses: actions/checkout@v4
        with:
          repository: Farama-Foundation/miniwob-plusplus
          ref: 7fd85d71a4b60325c6585396ec4f48377d049838
          path: vendor/miniwob-plusplus
          persist-credentials: false
      - run: python -m playwright install --with-deps chromium
      - run: BULFM_REAL_BROWSER=1 python -m pytest -q tests/test_reasoning_actions.py
